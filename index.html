<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Control Center</title>
    
    <meta name="theme-color" content="#4F46E5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIklQVFYgQ29udHJvbCBDZW50ZXIiLAogICJzaG9ydF9uYW1lIjogIklQVFYgQWRtaW4iLAogICJzdGFydF91cmwiOiAiLiIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiI0Y4RkE5QyIsCiAgInRoZW1lX2NvbG9yIjogIiM0RjQ2RTUiLAogICJpY29ucyI6IFsKICAgIHsKICAgICAgInNyYyI6ICJodHRwczovL2Nkbi1pY29ucy1wbmcuZmxhdGljb24uY29tLzUxMi83MzgvNzM4NTI2LnBuZyIsCiAgICAgICJzaXplcyI6ICI1MTJ4NTEyIiwKICAgICAgInR5cGUiOiAiaW1hZ2UvcG5nIiwKICAgICAgInB1cnBvc2UiOiAiYW55IG1hc2thYmxlIgogICAgfQogIF0KfQ==">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased custom-scrollbar">

    <nav class="bg-indigo-600 text-white shadow-md sticky top-0 z-50 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <svg class="w-7 h-7 text-indigo-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"/></svg>
            <h1 class="text-xl font-bold tracking-tight">IPTV Control Panel</h1>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="syncStatus()" class="bg-indigo-700 hover:bg-indigo-800 transition px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-1.5 shadow-inner">
                <svg class="w-4 h-4 animate-spin-hover" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.253 8H18"/></svg>
                Sync Status
            </button>
            <button id="installPwa" class="hidden bg-emerald-600 hover:bg-emerald-700 transition px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-1">
                Install App
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

        <div class="grid grid-cols-2 md:grid-cols-5 gap-3 md:gap-4">
            <div onclick="filterByStatus('all')" class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs cursor-pointer hover:border-indigo-400 transition flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase">Total Channels</p>
                    <h3 id="count-total" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                </div>
                <div class="p-2.5 bg-indigo-50 text-indigo-600 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"/></svg>
                </div>
            </div>
            <div onclick="filterByStatus('online')" class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs cursor-pointer hover:border-emerald-400 transition flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-emerald-600 uppercase">🟢 Online</p>
                    <h3 id="count-online" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                </div>
                <div class="p-2.5 bg-emerald-50 text-emerald-600 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </div>
            </div>
            <div onclick="filterByStatus('offline')" class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs cursor-pointer hover:border-rose-400 transition flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-rose-600 uppercase">🔴 Offline</p>
                    <h3 id="count-offline" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                </div>
                <div class="p-2.5 bg-rose-50 text-rose-600 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </div>
            </div>
            <div onclick="filterByStatus('online')" class="bg-emerald-50 p-4 rounded-xl border border-emerald-200 shadow-xs cursor-pointer hover:bg-emerald-100/70 transition flex flex-col justify-between">
                <span class="text-xs font-bold text-emerald-800 tracking-wider">📋 Online List</span>
                <span class="text-[11px] text-emerald-600 mt-2 flex items-center gap-1 font-medium">Click to view <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></span>
            </div>
            <div onclick="filterByStatus('offline')" class="bg-rose-50 p-4 rounded-xl border border-rose-200 shadow-xs cursor-pointer hover:bg-rose-100/70 transition flex flex-col justify-between">
                <span class="text-xs font-bold text-rose-800 tracking-wider">📋 Offline List</span>
                <span class="text-[11px] text-rose-600 mt-2 flex items-center gap-1 font-medium">Click to view <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></span>
            </div>
        </div>

        <div class="flex flex-col md:flex-row gap-3 justify-between items-center bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
            <div class="relative w-full md:w-96">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </span>
                <input type="text" id="searchInput" oninput="searchChannels()" placeholder="Search channels by name or category..." class="w-full bg-slate-50 border border-slate-200 rounded-lg pl-10 pr-4 py-2 text-sm focus:outline-hidden focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
            </div>
            <button onclick="openModal()" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm px-4 py-2.5 rounded-lg transition flex items-center justify-center gap-2 shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                Add New Channel
            </button>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto custom-scrollbar">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs font-semibold uppercase tracking-wider">
                            <th class="py-3 px-4 text-center w-16">Ch No.</th>
                            <th class="py-3 px-4">Logo</th>
                            <th class="py-3 px-4">Channel Details</th>
                            <th class="py-3 px-4 hidden md:table-cell">Category</th>
                            <th class="py-3 px-4 text-center">Status</th>
                            <th class="py-3 px-4 text-center w-28">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="channelTableBody" class="divide-y divide-slate-100 text-sm">
                        <tr>
                            <td colspan="6" class="text-center py-12 text-slate-400">
                                <div class="flex flex-col items-center justify-center gap-2">
                                    <svg class="w-8 h-8 animate-spin text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.253 8H18"/></svg>
                                    <span>Fetching playlist data...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="channelModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden border border-slate-100 transform transition-all">
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-800">Add Channel Configuration</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition">
                    <svg class="w-6 trim-svg h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <form id="channelForm" onsubmit="saveChannel(event)" class="p-6 space-y-4">
                <input type="hidden" id="oldSerial">
                <div class="grid grid-cols-3 gap-3">
                    <div class="col-span-1">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Serial *</label>
                        <input type="number" id="chanSerial" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-hidden focus:ring-2 focus:ring-indigo-500 focus:bg-white" placeholder="e.g. 5">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Channel Name *</label>
                        <input type="text" id="chanName" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-hidden focus:ring-2 focus:ring-indigo-500 focus:bg-white" placeholder="e.g. NTV">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Category *</label>
                    <input type="text" id="chanCategory" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-hidden focus:ring-2 focus:ring-indigo-500 focus:bg-white" placeholder="e.g. Entertainment, News">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Stream Source M3U8 URL *</label>
                    <textarea id="chanUrl" required rows="2" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-hidden focus:ring-2 focus:ring-indigo-500 focus:bg-white custom-scrollbar" placeholder="https://domain.com/live.m3u8|referer=...&User-Agent=..."></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Logo URL</label>
                    <input type="url" id="chanLogo" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-hidden focus:ring-2 focus:ring-indigo-500 focus:bg-white" placeholder="https://domain.com/logo.png">
                </div>
                <div class="bg-slate-50 -mx-6 -mb-6 p-4 mt-6 flex justify-end gap-2 border-t border-slate-200">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-200 text-slate-600 rounded-lg text-sm font-medium hover:bg-slate-100 transition">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition shadow-xs flex items-center gap-1">
                        Save Channel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 🛠️ আপনার পার্ট-১ এর গুগল ওয়েব অ্যাপ ইউআরএলটি এখানে নিচে পেস্ট করুন
        const API_URL = "https://script.google.com/macros/s/AKfycbw6LTxDqmMzRn-5JRNQtXlCZ4j0-bto7nV_y6sYTKpmIWX5XAf2JxwpBv_-Uf0butyH/exec"; 

        let allChannels = [];
        let currentFilter = 'all';

        document.addEventListener('DOMContentLoaded', fetchChannels);

        // API থেকে চ্যানেল ডেটা নামানো
        async function fetchChannels() {
            try {
                const response = await fetch(`${API_URL}?action=getChannels`);
                const result = await response.json();
                if (result.status === 'success') {
                    allChannels = result.data;
                    updateDashboard();
                }
            } catch (error) {
                alert('API Connection Failed. Please deploy App Script properly.');
            }
        }

        // ড্যাশবোর্ড ডাটা রেন্ডার ও ক্যালকুলেশন
        function updateDashboard() {
            const tbody = document.getElementById('channelTableBody');
            tbody.innerHTML = '';

            let onlineCount = 0;
            let offlineCount = 0;

            let filtered = allChannels.filter(ch => {
                if (currentFilter === 'online') return ch.status === 'Online';
                if (currentFilter === 'offline') return ch.status !== 'Online';
                return true;
            });

            allChannels.forEach(ch => {
                if(ch.status === 'Online') onlineCount++;
                else offlineCount++;
            });

            document.getElementById('count-total').innerText = allChannels.length;
            document.getElementById('count-online').innerText = onlineCount;
            document.getElementById('count-offline').innerText = offlineCount;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-400">No channels found.</td></tr>`;
                return;
            }

            filtered.forEach(ch => {
                const isOnline = ch.status === 'Online';
                const row = document.createElement('tr');
                row.className = "hover:bg-slate-50/80 transition";
                row.innerHTML = `
                    <td class="py-3 px-4 text-center font-bold text-slate-500">${ch.serial}</td>
                    <td class="py-3 px-4">
                        <img src="${ch.logo || 'https://images.unsplash.com/photo-1594909122845-11baa439b7bf?q=80&w=120&auto=format&fit=crop'}" alt="" class="w-9 h-9 object-cover rounded-lg bg-slate-100 border border-slate-200">
                    </td>
                    <td class="py-3 px-4">
                        <div class="font-semibold text-slate-800">${ch.name}</div>
                        <div class="text-xs text-slate-400 font-mono mt-0.5 truncate max-w-xs md:max-w-lg">${ch.url}</div>
                        <div class="text-xs md:hidden mt-1 text-indigo-600 font-medium">${ch.category}</div>
                    </td>
                    <td class="py-3 px-4 hidden md:table-cell text-slate-600 font-medium">${ch.category}</td>
                    <td class="py-3 px-4 text-center">
                        <span class="inline-flex items-center gap-1 px-2 py-1 text-xs font-semibold rounded-full ${isOnline ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}">
                            <span class="w-1.5 h-1.5 rounded-full ${isOnline ? 'bg-emerald-500' : 'bg-rose-500'}"></span>
                            ${ch.status}
                        </span>
                    </td>
                    <td class="py-3 px-4 text-center">
                        <div class="flex items-center justify-center gap-1.5">
                            <button onclick="editChannel(${ch.serial})" class="p-1.5 text-blue-600 hover:bg-blue-50 rounded-md transition" title="Edit">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                            </button>
                            <button onclick="deleteChannel(${ch.serial})" class="p-1.5 text-rose-600 hover:bg-rose-50 rounded-md transition" title="Delete">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-16v4M4 7h16"/></svg>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // ক্রিয়েট বা এডিট ডেটা সাবমিট
        async function saveChannel(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true; btn.innerText = "Processing...";

            const channelPayload = {
                serial: document.getElementById('chanSerial').value,
                name: document.getElementById('chanName').value,
                category: document.getElementById('chanCategory').value,
                url: document.getElementById('chanUrl').value,
                logo: document.getElementById('chanLogo').value,
                oldSerial: document.getElementById('oldSerial').value || null
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'addOrEdit', channel: channelPayload })
                });
                const res = await response.json();
                if(res.status === 'success') {
                    closeModal();
                    await fetchChannels();
                }
            } catch (error) { alert('Operation Failed'); }
            btn.disabled = false; btn.innerText = "Save Channel";
        }

        // এডিট মোড ওপেন
        function editChannel(serial) {
            const ch = allChannels.find(c => c.serial === serial);
            if(!ch) return;
            document.getElementById('modalTitle').innerText = "Edit Channel Configuration";
            document.getElementById('oldSerial').value = ch.serial;
            document.getElementById('chanSerial').value = ch.serial;
            document.getElementById('chanName').value = ch.name;
            document.getElementById('chanCategory').value = ch.category;
            document.getElementById('chanUrl').value = ch.url;
            document.getElementById('chanLogo').value = ch.logo;
            document.getElementById('channelModal').classList.remove('hidden');
        }

        // চ্যানেল ডিলিট করা
        async function deleteChannel(serial) {
            if(!confirm(`Are you sure you want to delete Channel No: ${serial}?`)) return;
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'delete', id: serial })
                });
                const res = await response.json();
                if(res.status === 'success') await fetchChannels();
            } catch (error) { alert('Delete failed'); }
        }

        // ইনস্ট্যান্ট ম্যানুয়াল সিনক্রোনাইজেশন
        async function syncStatus() {
            const icon = document.querySelector('.animate-spin-hover');
            icon.classList.add('animate-spin');
            try {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'syncStatus' }) });
                await fetchChannels();
            } catch (error) { alert('Sync Failed'); }
            icon.classList.remove('animate-spin');
        }

        // লাইভ সার্চ ফিল্টার
        function searchChannels() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const tbody = document.getElementById('channelTableBody');
            const rows = tbody.querySelectorAll('tr');

            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                if(text.includes(query) || query === "") row.style.display = "";
                else row.style.display = "none";
            });
        }

        // কার্ড অনুযায়ী ফিল্টার সিস্টেম
        function filterByStatus(type) {
            currentFilter = type;
            updateDashboard();
        }

        // মডেল কন্ট্রোল
        function openModal() {
            document.getElementById('channelForm').reset();
            document.getElementById('oldSerial').value = '';
            document.getElementById('modalTitle').innerText = "Add Channel Configuration";
            document.getElementById('channelModal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('channelModal').classList.add('hidden'); }

        // PWA ইনস্টলেশন লজিক
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); deferredPrompt = e;
            const btn = document.getElementById('installPwa');
            btn.classList.remove('hidden');
            btn.addEventListener('click', () => {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choice) => {
                    if (choice.outcome === 'accepted') btn.classList.add('hidden');
                    deferredPrompt = null;
                });
            });
        });
    </script>
</body>
</html>
