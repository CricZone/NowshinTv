    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzmAW7n2kf2YbJd7zzjiqhuWfkBRo8Pu0EPPHA1GGqKsvoPNcF5379sWBHTiqRwQ4hU/exec"; 

        let allChannels = [];
        let currentFilter = 'all';

        // Apps entry point optimizing load times
        document.addEventListener('DOMContentLoaded', () => {
            renderLoadingSkeleton();
            fetchChannels(true); // Instant load + Background Sync activation
            updateActiveTickmark();
        });

        function toggleMenu(event) {
            event.stopPropagation();
            const menu = document.getElementById('dotMenu');
            menu.classList.toggle('hidden');
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            const ball = document.getElementById('themeToggleBall');
            if(html.classList.contains('dark')) {
                html.classList.remove('dark');
                ball.classList.replace('translate-x-3.5', 'translate-x-0');
            } else {
                html.classList.add('dark');
                ball.classList.replace('translate-x-0', 'translate-x-3.5');
            }
        }

        function renderLoadingSkeleton() {
            const tbody = document.getElementById('channelTableBody');
            const mobileWrapper = document.getElementById('channelMobileWrapper');
            
            let skeletonRows = '';
            let skeletonCards = '';

            for (let i = 0; i < 4; i++) {
                skeletonRows += `
                    <tr>
                        <td class="py-4 px-5 text-center"><div class="shimmer h-4 rounded w-8 mx-auto"></div></td>
                        <td class="py-4 px-5"><div class="shimmer w-10 h-10 rounded-xl"></div></td>
                        <td class="py-4 px-5"><div class="shimmer h-4 rounded w-32 mb-2"></div><div class="shimmer h-3 rounded w-56"></div></td>
                        <td class="py-4 px-5"><div class="shimmer h-5 rounded-lg w-20"></div></td>
                        <td class="py-4 px-5 text-center"><div class="shimmer h-6 rounded-full w-20 mx-auto"></div></td>
                        <td class="py-4 px-5 text-center"><div class="shimmer h-8 rounded-xl w-20 mx-auto"></div></td>
                    </tr>`;
                
                skeletonCards += `
                    <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
                        <div class="flex items-center gap-3">
                            <div class="shimmer w-11 h-11 rounded-xl shrink-0"></div>
                            <div class="flex-1 space-y-2">
                                <div class="shimmer h-4 rounded w-1/3"></div>
                                <div class="shimmer h-3 rounded w-2/3"></div>
                            </div>
                        </div>
                    </div>`;
            }
            tbody.innerHTML = skeletonRows;
            mobileWrapper.innerHTML = skeletonCards;
        }

        async function fetchChannels(triggerAutoSync = false) {
            try {
                const response = await fetch(`${API_URL}?action=getChannels`);
                const result = await response.json();
                if (result.status === 'success') {
                    allChannels = result.data;
                    updateDashboard();
                    
                    // Instantly trigger background global health-check if requested
                    if(triggerAutoSync) {
                        autoSyncBackground();
                    }
                }
            } catch (error) {
                console.error('API Connection Error');
            }
        }

        // Global background health-checker framework
        async function autoSyncBackground() {
            const icon = document.getElementById('syncIcon');
            if(icon) icon.classList.add('animate-spin');
            try {
                // Non-blocking sync processing on App Script Endpoint
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'syncStatus' }) });
                await fetchChannels(false);
            } catch (e) { console.log('Background automated sync bypassed.'); }
            if(icon) icon.classList.remove('animate-spin');
        }

        function updateDashboard() {
            const tbody = document.getElementById('channelTableBody');
            const mobileWrapper = document.getElementById('channelMobileWrapper');
            
            if(!tbody || !mobileWrapper) return;
            tbody.innerHTML = '';
            mobileWrapper.innerHTML = '';

            let onlineCount = 0;
            let offlineCount = 0;

            let filtered = allChannels.filter(ch => {
                if (currentFilter === 'online') return ch.status === 'Online';
                if (currentFilter === 'offline') return ch.status !== 'Online';
                return true;
            });

            allChannels.forEach(ch => {
                if(ch.status === 'Online') onlineCount++;
                else offlineCount++;
            });

            document.getElementById('count-total').innerText = allChannels.length;
            document.getElementById('count-online').innerText = onlineCount;
            document.getElementById('count-offline').innerText = offlineCount;

            ['all', 'online', 'offline'].forEach(t => {
                const card = document.getElementById(`card-${t}`);
                if (card) {
                    if (currentFilter === t) {
                        card.classList.add('border-indigo-500/60', 'bg-slate-850');
                    } else {
                        card.classList.remove('border-indigo-500/60', 'bg-slate-850');
                    }
                }
            });

            updateActiveTickmark();

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-12 text-slate-500 font-medium">No active channels found.</td></tr>`;
                mobileWrapper.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs">No active channels found.</div>`;
                return;
            }

            filtered.forEach(ch => {
                const isOnline = ch.status === 'Online';
                const logoImg = ch.logo || 'https://images.unsplash.com/photo-1594909122845-11baa439b7bf?q=80&w=120&auto=format&fit=crop';
                
                const row = document.createElement('tr');
                row.id = `channel-row-${ch.serial}`;
                row.className = "hover:bg-slate-950/40 transition-all group";
                row.innerHTML = `
                    <td class="py-3.5 px-5 text-center font-bold text-slate-500 font-mono">${ch.serial}</td>
                    <td class="py-3.5 px-5">
                        <img src="${logoImg}" alt="" class="w-10 h-10 object-cover rounded-xl bg-slate-950 border border-slate-800 shadow-inner">
                    </td>
                    <td class="py-3.5 px-5">
                        <div class="font-bold text-slate-200 group-hover:text-indigo-400 transition-colors">${ch.name}</div>
                        <div class="text-xs text-slate-500 font-mono mt-0.5 truncate max-w-md">${ch.url}</div>
                    </td>
                    <td class="py-3.5 px-5"><span class="px-2.5 py-1 bg-slate-950 border border-slate-800 rounded-lg text-xs font-semibold text-slate-400">${ch.category}</span></td>
                    <td class="py-3.5 px-5 text-center">
                        <span class="inline-flex items-center gap-1.5 px-3 py-1 text-xs font-bold rounded-full ${isOnline ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 glow-online' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20 glow-offline'}">
                            <span class="w-1.5 h-1.5 rounded-full ${isOnline ? 'bg-emerald-400 animate-ping' : 'bg-rose-400'}"></span>
                            ${ch.status}
                        </span>
                    </td>
                    <td class="py-3.5 px-5 text-center">
                        <div class="flex items-center justify-center gap-1.5">
                            <button onclick="editChannel(${ch.serial})" class="p-2 text-indigo-400 hover:bg-indigo-500/10 rounded-xl border border-transparent hover:border-indigo-500/30 transition-all active:scale-90" title="Edit">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                            </button>
                            <button onclick="deleteChannel(${ch.serial})" class="p-2 text-rose-400 hover:bg-rose-500/10 rounded-xl border border-transparent hover:border-rose-500/30 transition-all active:scale-90" title="Delete">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-16v4M4 7h16"/></svg>
                            </button>
                        </div>
                    </td>`;
                tbody.appendChild(row);

                const mobileCard = document.createElement('div');
                mobileCard.id = `channel-card-${ch.serial}`;
                mobileCard.className = "bg-slate-900 p-3.5 rounded-2xl border border-slate-800 flex items-center justify-between gap-3 shadow-md";
                mobileCard.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <img src="${logoImg}" alt="" class="w-11 h-11 object-cover rounded-xl bg-slate-950 border border-slate-800 shrink-0">
                        <div class="overflow-hidden">
                            <div class="flex items-center gap-1.5">
                                <span class="text-[9px] font-bold font-mono text-slate-500 bg-slate-950 px-1.5 py-0.5 rounded border border-slate-800">${ch.serial}</span>
                                <h4 class="font-bold text-slate-200 truncate text-sm">${ch.name}</h4>
                            </div>
                            <p class="text-[10px] text-indigo-400 font-semibold truncate mt-0.5">${ch.category}</p>
                            <div class="flex items-center gap-1 mt-1">
                                <span class="w-1.5 h-1.5 rounded-full ${isOnline ? 'bg-emerald-400' : 'bg-rose-400'}"></span>
                                <span class="text-[9px] font-bold uppercase tracking-wider text-slate-400">${ch.status}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 shrink-0 bg-slate-950/60 p-1 rounded-xl border border-slate-800/80">
                        <button onclick="editChannel(${ch.serial})" class="p-2 text-indigo-400 hover:bg-indigo-500/10 rounded-lg transition-all active:scale-90">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                        </button>
                        <button onclick="deleteChannel(${ch.serial})" class="p-2 text-rose-400 hover:bg-rose-500/10 rounded-lg transition-all active:scale-90">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-16v4M4 7h16"/></svg>
                        </button>
                    </div>`;
                mobileWrapper.appendChild(mobileCard);
            });
        }

        function updateActiveTickmark() {
            ['all', 'online', 'offline'].forEach(type => {
                const tickEl = document.getElementById(`tick-${type}`);
                if (tickEl) {
                    if (currentFilter === type) {
                        tickEl.classList.remove('hidden');
                    } else {
                        tickEl.classList.add('hidden');
                    }
                }
            });
        }

        function scrollToDashboard() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            filterByStatus('all');
        }

        async function saveChannel(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true; btn.innerText = "Processing Data...";
            
            const icon = document.getElementById('syncIcon');
            if(icon) icon.classList.add('animate-spin'); 

            const targetSerial = document.getElementById('chanSerial').value;
            const channelPayload = {
                serial: targetSerial,
                name: document.getElementById('chanName').value,
                category: document.getElementById('chanCategory').value,
                url: document.getElementById('chanUrl').value,
                logo: document.getElementById('chanLogo').value,
                oldSerial: document.getElementById('oldSerial').value || null
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'addOrEdit', channel: channelPayload })
                });
                const res = await response.json();
                if(res.status === 'success') {
                    closeModal();
                    
                    // Trigger dynamic single channel verification instantly to guarantee validation
                    await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'syncStatus', targetId: targetSerial })
                    });

                    // Fresh reload of updated configurations
                    await fetchChannels(false);
                }
            } catch (error) { alert('Operation Failed'); }
            btn.disabled = false; btn.innerText = "Save Configuration";
            if(icon) icon.classList.remove('animate-spin');
        }

        function editChannel(serial) {
            const ch = allChannels.find(c => c.serial === serial);
            if(!ch) return;
            document.getElementById('modalTitle').innerText = "Update Configuration";
            document.getElementById('oldSerial').value = ch.serial;
            document.getElementById('chanSerial').value = ch.serial;
            document.getElementById('chanName').value = ch.name;
            document.getElementById('chanCategory').value = ch.category;
            document.getElementById('chanUrl').value = ch.url;
            document.getElementById('chanLogo').value = ch.logo;
            document.getElementById('channelModal').classList.remove('hidden');
        }

        async function deleteChannel(serial) {
            if(!confirm(`Are you sure you want to delete Channel No: ${serial}?`)) return;
            
            const rowTarget = document.getElementById(`channel-row-${serial}`);
            const cardTarget = document.getElementById(`channel-card-${serial}`);
            if(rowTarget) rowTarget.style.opacity = '0.3';
            if(cardTarget) cardTarget.style.opacity = '0.3';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'delete', id: serial })
                });
                const res = await response.json();
                if(res.status === 'success') {
                    if(rowTarget) rowTarget.remove();
                    if(cardTarget) cardTarget.remove();
                    allChannels = allChannels.filter(c => c.serial !== serial);
                    
                    let onlineCount = 0, offlineCount = 0;
                    allChannels.forEach(ch => { ch.status === 'Online' ? onlineCount++ : offlineCount++; });
                    document.getElementById('count-total').innerText = allChannels.length;
                    document.getElementById('count-online').innerText = onlineCount;
                    document.getElementById('count-offline').innerText = offlineCount;
                } else {
                    if(rowTarget) rowTarget.style.opacity = '1';
                    if(cardTarget) cardTarget.style.opacity = '1';
                    alert('Delete failed on server.');
                }
            } catch (error) { 
                if(rowTarget) rowTarget.style.opacity = '1';
                if(cardTarget) cardTarget.style.opacity = '1';
                alert('Delete Action Failed'); 
            }
        }

        async function syncStatus() {
            const icon = document.getElementById('syncIcon');
            if(icon) icon.classList.add('animate-spin');
            try {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'syncStatus' }) });
                await fetchChannels(false);
            } catch (error) { alert('Sync Automation Failed'); }
            if(icon) icon.classList.remove('animate-spin');
        }

        function searchChannelsAll() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const tbody = document.getElementById('channelTableBody');
            const rows = tbody.querySelectorAll('tr');
            rows.forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(query) ? "" : "none";
            });

            const mobileWrapper = document.getElementById('channelMobileWrapper');
            const cards = mobileWrapper.children;
            for(let card of cards){
                card.style.display = card.innerText.toLowerCase().includes(query) ? "flex" : "none";
            }
        }

        function filterByStatus(type) {
            currentFilter = type;
            updateDashboard();
        }

        function openModal() {
            document.getElementById('channelForm').reset();
            document.getElementById('oldSerial').value = '';
            document.getElementById('modalTitle').innerText = "Add Channel Configuration";
            document.getElementById('channelModal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('channelModal').classList.add('hidden'); }

        window.addEventListener('click', function(e){
            const menu = document.getElementById('dotMenu');
            if (!e.target.closest('#dotMenu') && !e.target.closest('button[onclick^="toggleMenu"]')) {
                menu.classList.add('hidden');
            }
        });

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); deferredPrompt = e;
            const btn = document.getElementById('installPwa');
            if (btn) {
                btn.classList.remove('hidden');
                btn.addEventListener('click', () => {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then((choice) => {
                        if (choice.outcome === 'accepted') btn.classList.add('hidden');
                        deferredPrompt = null;
                    });
                });
            }
        });
    </script>
</body>
</html>
